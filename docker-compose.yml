# Optional Docker path for the development database.
#
# This machine does not have Docker installed, so Phase 1 uses the official
# PostgreSQL 17 portable binaries managed by scripts/pg.ps1 instead. This file
# is kept because the repository should remain reproducible on machines that
# do have Docker, and because the release/deployment work in Phase 9 may
# containerise the database.
#
# Both paths must stay schema-compatible: they are the same PostgreSQL major
# version, and the schema lives only in database/migrations.

services:
  db:
    image: postgres:17-alpine
    container_name: bcis-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: bcis
      POSTGRES_USER: bcis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bcis_dev_password}
      # Deterministic collation so ORDER BY on names is stable across machines.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale-provider=icu --icu-locale=en-PH'
    ports:
      # 5433 on the host to avoid colliding with a native PostgreSQL service.
      - '127.0.0.1:5433:5432'
    volumes:
      - bcis_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bcis -d bcis']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bcis_pgdata:
